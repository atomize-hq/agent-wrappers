name: CI

on:
  pull_request:
    branches:
      - staging
      - main
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches:
      - main
      - feat/codex-cli-parity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-purpose:
    name: PR purpose (staging -> main)
    runs-on: ubuntu-latest
    outputs:
      purpose: ${{ steps.purpose.outputs.purpose }}
    steps:
      - name: Determine staging -> main labels
        id: purpose
        shell: bash
        run: |
          set -euo pipefail
          # Only meaningful for pull_request events (especially staging -> main).
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "purpose=non_pr" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.base_ref }}" != "main" ] || [ "${{ github.head_ref }}" != "staging" ]; then
            echo "purpose=non_staging_to_main" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t labels < <(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH" || true)
          purpose=""
          for l in "${labels[@]}"; do
            case "$l" in
              repo_release|ops|codex_release|claude_code_release)
                if [ -n "$purpose" ] && [ "$purpose" != "$l" ]; then
                  echo "purpose=invalid" >> "$GITHUB_OUTPUT"
                  echo "staging -> main PRs must choose exactly one allowed label." >&2
                  echo "Allowed labels:" >&2
                  echo "  - repo_release" >&2
                  echo "  - ops" >&2
                  echo "  - codex_release" >&2
                  echo "  - claude_code_release" >&2
                  exit 1
                fi
                purpose="$l"
                ;;
              *) ;;
            esac
          done

          if [ -z "$purpose" ]; then
            echo "purpose=missing" >> "$GITHUB_OUTPUT"
            echo "Missing required staging -> main label. Add exactly one of:" >&2
            echo "  - repo_release" >&2
            echo "  - ops" >&2
            echo "  - codex_release" >&2
            echo "  - claude_code_release" >&2
            exit 1
          fi

          echo "purpose=$purpose" >> "$GITHUB_OUTPUT"

  repo-version-guards:
    name: Repo version guards
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.version-changelog-diff.outputs.version_changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Guard VERSION matches workspace version
        shell: bash
        run: |
          set -euo pipefail
          version_file="$(tr -d '[:space:]' < VERSION)"
          cargo_version="$(python3 - <<'PY'
          import tomllib

          with open("Cargo.toml", "rb") as fh:
              data = tomllib.load(fh)

          print(data["workspace"]["package"]["version"])
          PY
          )"

          echo "VERSION file: $version_file"
          echo "Cargo workspace version: $cargo_version"

          if [ "$version_file" != "$cargo_version" ]; then
            echo "Root VERSION must match Cargo.toml [workspace.package].version." >&2
            exit 1
          fi

      - name: Guard publishable crate versions and pins
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_publish_versions.py

      - name: Guard CHANGELOG.md updates when VERSION changes
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        id: version-changelog-diff
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            compare_sha="$(git merge-base "$base_sha" "$head_sha")"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
            compare_sha="$base_sha"
          fi

          if [ -z "$compare_sha" ] || [ "$compare_sha" = "0000000000000000000000000000000000000000" ]; then
            echo "No comparable base commit is available; skipping VERSION/CHANGELOG diff guard."
            echo "version_changed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version_changed=0
          changelog_changed=0

          if ! git diff --quiet "$compare_sha" "$head_sha" -- VERSION; then
            version_changed=1
          fi

          if ! git diff --quiet "$compare_sha" "$head_sha" -- CHANGELOG.md; then
            changelog_changed=1
          fi

          if (( version_changed == 1 && changelog_changed == 0 )); then
            echo "Root VERSION changed between $compare_sha and $head_sha, but CHANGELOG.md did not." >&2
            echo "Update CHANGELOG.md whenever the root VERSION file changes." >&2
            exit 1
          fi

          echo "version_changed=$version_changed" >> "$GITHUB_OUTPUT"
          echo "VERSION changed: $version_changed"
          echo "CHANGELOG.md changed: $changelog_changed"

  publish-readiness:
    name: Publish readiness
    needs: repo-version-guards
    if: ${{ needs.repo-version-guards.outputs.version_changed == '1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit test publish planner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate publish readiness
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_publish_readiness.py
      - name: Preview publish plan
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/publish_crates.py \
            --plan \
            --root . \
            --release-version "$(tr -d '[:space:]' < VERSION)"

  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: make preflight
        shell: bash
        run: |
          set -euo pipefail
          make preflight

  rust-tests:
    name: Rust tests (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --all-targets

  agent-api-all-features:
    name: Agent API tests (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test -p unified-agent-api --all-features
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p unified-agent-api --all-features

  loc-check:
    name: LOC cap (Rust files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: make loc-check
        shell: bash
        run: |
          set -euo pipefail
          make loc-check

  agent-api-backend-type-leak-guard:
    name: Agent API backend type leak guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: "Guard: no backend types in pub API"
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p xtask -- agent-api-backend-type-leak-guard

  capability-matrix:
    name: Capability matrix (fresh + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: make capability-matrix-guard
        shell: bash
        run: |
          set -euo pipefail
          make capability-matrix-guard

  codex-validate-artifacts:
    name: Validate Codex committed artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: codex-artifacts
        name: Detect Codex committed artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(cli_manifests/codex/versions/*.json)
          if (( ${#files[@]} > 0 )); then
            echo "has_versions=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_versions=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip (no Codex artifacts committed yet)
        if: ${{ steps.codex-artifacts.outputs.has_versions != 'true' }}
        shell: bash
        run: echo "No cli_manifests/codex/versions/*.json; skipping manifest-validate."

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ steps.codex-artifacts.outputs.has_versions == 'true' }}

      - name: xtask manifest-validate
        if: ${{ steps.codex-artifacts.outputs.has_versions == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p xtask -- manifest-validate --root cli_manifests/codex

  claude-validate-artifacts:
    name: Validate Claude Code committed artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: xtask manifest-validate (claude_code root)
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p xtask -- manifest-validate --root cli_manifests/claude_code

  opencode-validate-artifacts:
    name: Validate OpenCode committed artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: opencode-artifacts
        name: Detect OpenCode committed artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(cli_manifests/opencode/versions/*.json)
          if (( ${#files[@]} > 0 )); then
            echo "has_versions=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_versions=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip (no OpenCode artifacts committed yet)
        if: ${{ steps.opencode-artifacts.outputs.has_versions != 'true' }}
        shell: bash
        run: echo "No cli_manifests/opencode/versions/*.json; skipping manifest-validate."

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ steps.opencode-artifacts.outputs.has_versions == 'true' }}

      - name: xtask manifest-validate (opencode root)
        if: ${{ steps.opencode-artifacts.outputs.has_versions == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p xtask -- manifest-validate --root cli_manifests/opencode

      - uses: dtolnay/rust-toolchain@stable

      # `manifest-validate` covers the committed artifacts; the acquisition descriptors are a
      # separate surface that is only exercised at CI-dispatch time. Resolve every enrolled
      # agent's descriptor here so a malformed block fails on the PR that introduces it rather
      # than on the next watcher run.
      - name: Resolve every acquisition descriptor
        shell: bash
        run: |
          set -euo pipefail
          for agent in codex claude_code opencode; do
            echo "::group::${agent}"
            cargo run -p xtask -- manifest-acquisition-plan --agent "$agent" --version 1.2.3 > /dev/null
            echo "::endgroup::"
          done

  versions:
    name: Read Codex version pointers
    runs-on: ubuntu-latest
    outputs:
      latest_validated: ${{ steps.versions.outputs.latest_validated }}
      min_supported: ${{ steps.versions.outputs.min_supported }}
    steps:
      - uses: actions/checkout@v5
      - id: versions
        shell: bash
        run: |
          set -euo pipefail
          echo "latest_validated=$(tr -d '\n' < cli_manifests/codex/latest_validated.txt)" >> "$GITHUB_OUTPUT"
          echo "min_supported=$(tr -d '\n' < cli_manifests/codex/min_supported.txt)" >> "$GITHUB_OUTPUT"

  claude-versions:
    name: Read Claude Code version pointers
    runs-on: ubuntu-latest
    outputs:
      latest_validated: ${{ steps.versions.outputs.latest_validated }}
    steps:
      - uses: actions/checkout@v5
      - id: versions
        shell: bash
        run: |
          set -euo pipefail
          echo "latest_validated=$(tr -d '\n' < cli_manifests/claude_code/latest_validated.txt)" >> "$GITHUB_OUTPUT"

  linux-latest-validated:
    name: Linux (latest validated)
    runs-on: ubuntu-latest
    needs: [versions, pr-purpose]
    if: ${{ !(github.event_name == 'push' && github.ref_name == 'main') && (github.event_name != 'pull_request' || github.base_ref != 'main' || needs.pr-purpose.outputs.purpose == 'codex_release') }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Acquire Codex CLI
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.versions.outputs.latest_validated }}"
          TARGET="x86_64-unknown-linux-musl"
          ASSET="codex-${TARGET}.tar.gz"

          URL="$(jq -r --arg v "$VERSION" --arg t "$TARGET" --arg a "$ASSET" '.artifacts[] | select(.codex_version==$v and .target_triple==$t and .asset_name==$a) | .download_url' cli_manifests/codex/artifacts.lock.json)"
          SHA="$(jq -r --arg v "$VERSION" --arg t "$TARGET" --arg a "$ASSET" '.artifacts[] | select(.codex_version==$v and .target_triple==$t and .asset_name==$a) | .sha256' cli_manifests/codex/artifacts.lock.json)"
          SIZE="$(jq -r --arg v "$VERSION" --arg t "$TARGET" --arg a "$ASSET" '.artifacts[] | select(.codex_version==$v and .target_triple==$t and .asset_name==$a) | .size_bytes' cli_manifests/codex/artifacts.lock.json)"

          test -n "$URL" && test "$URL" != "null"
          test -n "$SHA" && test "$SHA" != "null"
          test -n "$SIZE" && test "$SIZE" != "null"

          curl -fsSL -o codex.tgz "$URL"
          test "$(wc -c < codex.tgz)" = "$SIZE"
          echo "$SHA  codex.tgz" | sha256sum -c -
          MEMBER="$(tar -tzf codex.tgz | awk 'NF && substr($0,length($0),1) != "/" {print; exit}')"
          test -n "$MEMBER"
          rm -rf _extract
          mkdir -p _extract
          tar -xzf codex.tgz -C _extract "$MEMBER"
          install -m 0755 "_extract/$MEMBER" ./codex-x86_64-unknown-linux-musl
          ./codex-x86_64-unknown-linux-musl --version

      - name: Validated checks (real binary)
        shell: bash
        run: |
          set -euo pipefail
          export CODEX_E2E_HOME="$(mktemp -d)"
          export CODEX_HOME="$CODEX_E2E_HOME"
          export CODEX_BINARY=./codex-x86_64-unknown-linux-musl
          cargo test -p unified-agent-api-codex
          cargo test -p unified-agent-api-codex --examples
          cargo run -p unified-agent-api-codex --example feature_detection
          cargo run -p unified-agent-api-codex --example capability_snapshot -- "$CODEX_BINARY" "$CODEX_E2E_HOME/capabilities.json" auto
          CODEX_E2E_BINARY=./codex-x86_64-unknown-linux-musl cargo test -p unified-agent-api-codex --test cli_e2e -- --nocapture

  linux-min-supported:
    name: Linux (min supported)
    runs-on: ubuntu-latest
    needs: [versions, pr-purpose]
    if: ${{ !(github.event_name == 'push' && github.ref_name == 'main') && (needs.versions.outputs.min_supported != needs.versions.outputs.latest_validated) && (github.event_name != 'pull_request' || github.base_ref != 'main' || needs.pr-purpose.outputs.purpose == 'codex_release') }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Acquire Codex CLI
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.versions.outputs.min_supported }}"
          TARGET="x86_64-unknown-linux-musl"
          ASSET="codex-${TARGET}.tar.gz"

          URL="$(jq -r --arg v "$VERSION" --arg t "$TARGET" --arg a "$ASSET" '.artifacts[] | select(.codex_version==$v and .target_triple==$t and .asset_name==$a) | .download_url' cli_manifests/codex/artifacts.lock.json)"
          SHA="$(jq -r --arg v "$VERSION" --arg t "$TARGET" --arg a "$ASSET" '.artifacts[] | select(.codex_version==$v and .target_triple==$t and .asset_name==$a) | .sha256' cli_manifests/codex/artifacts.lock.json)"
          SIZE="$(jq -r --arg v "$VERSION" --arg t "$TARGET" --arg a "$ASSET" '.artifacts[] | select(.codex_version==$v and .target_triple==$t and .asset_name==$a) | .size_bytes' cli_manifests/codex/artifacts.lock.json)"

          test -n "$URL" && test "$URL" != "null"
          test -n "$SHA" && test "$SHA" != "null"
          test -n "$SIZE" && test "$SIZE" != "null"

          curl -fsSL -o codex.tgz "$URL"
          test "$(wc -c < codex.tgz)" = "$SIZE"
          echo "$SHA  codex.tgz" | sha256sum -c -
          MEMBER="$(tar -tzf codex.tgz | awk 'NF && substr($0,length($0),1) != "/" {print; exit}')"
          test -n "$MEMBER"
          rm -rf _extract
          mkdir -p _extract
          tar -xzf codex.tgz -C _extract "$MEMBER"
          install -m 0755 "_extract/$MEMBER" ./codex-x86_64-unknown-linux-musl
          ./codex-x86_64-unknown-linux-musl --version

      - name: Validated checks (real binary)
        shell: bash
        run: |
          set -euo pipefail
          export CODEX_E2E_HOME="$(mktemp -d)"
          export CODEX_HOME="$CODEX_E2E_HOME"
          export CODEX_BINARY=./codex-x86_64-unknown-linux-musl
          cargo test -p unified-agent-api-codex
          cargo test -p unified-agent-api-codex --examples
          cargo run -p unified-agent-api-codex --example feature_detection
          cargo run -p unified-agent-api-codex --example capability_snapshot -- "$CODEX_BINARY" "$CODEX_E2E_HOME/capabilities.json" auto
          CODEX_E2E_BINARY=./codex-x86_64-unknown-linux-musl cargo test -p unified-agent-api-codex --test cli_e2e -- --nocapture

  linux-claude-latest-validated:
    name: Claude Code Linux (latest validated)
    runs-on: ubuntu-latest
    needs: [claude-versions, pr-purpose]
    if: ${{ !(github.event_name == 'push' && github.ref_name == 'main') && needs.claude-versions.outputs.latest_validated != 'none' && (github.event_name != 'pull_request' || github.base_ref != 'main' || needs.pr-purpose.outputs.purpose == 'claude_code_release') }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Target, binary path and runtime env come from the acquisition descriptor; the artifact
      # itself comes from the lockfile row. The two answer different questions: the descriptor
      # says how a *new* version would be acquired, while the row records what was *actually*
      # pinned for this one. They disagree across the distribution migration — 2.1.29 is pinned
      # as a bare binary from the old bucket, while the descriptor resolves an npm platform
      # tarball — so taking the asset name from the descriptor would demand a row that does not
      # exist. Reading the row keeps this job correct on both sides of the migration, including
      # after parity-acquire starts writing tarball-shaped rows.
      - name: Acquire Claude Code CLI (required target)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.claude-versions.outputs.latest_validated }}"
          mkdir -p _ci_tmp
          cargo run -p xtask -- manifest-acquisition-plan \
            --agent claude_code --version "$VERSION" --emit-json _ci_tmp/plan.json

          REQUIRED_TARGET="$(jq -r '.required_target' _ci_tmp/plan.json)"
          PLANNED="$(jq -c --arg t "$REQUIRED_TARGET" '.include[] | select(.target_triple==$t)' _ci_tmp/plan.json)"
          BIN="$(jq -r '.binary_path' <<<"$PLANNED")"
          VERSION_KEY="$(jq -r '.lockfile_version_key' _ci_tmp/plan.json)"

          LOCK=cli_manifests/claude_code/artifacts.lock.json
          ROW="$(jq -c --arg key "$VERSION_KEY" --arg v "$VERSION" --arg t "$REQUIRED_TARGET" \
            '.artifacts[] | select(.[$key]==$v and .target_triple==$t)' "$LOCK")"

          if [ -z "$ROW" ]; then
            echo "::error title=No usable lockfile pin::${LOCK} has no row for ${VERSION_KEY}=${VERSION} target=${REQUIRED_TARGET}. Re-run parity-acquire for this version." >&2
            exit 1
          fi

          ASSET="$(jq -r '.asset_name' <<<"$ROW")"
          URL="$(jq -r '.download_url' <<<"$ROW")"
          SHA="$(jq -r '.sha256' <<<"$ROW")"
          SIZE="$(jq -r '.size_bytes' <<<"$ROW")"

          curl -fsSL -o claude.bin "$URL"
          test "$(wc -c < claude.bin)" = "$SIZE"
          echo "$SHA  claude.bin" | sha256sum -c -

          # The pinned asset names its own shape: a tarball has to be unpacked, a bare binary is
          # already the executable. Trusting the descriptor's `archive` here would mis-handle
          # whichever side of the migration the row came from.
          case "$ASSET" in
            *.tgz|*.tar.gz)
              MEMBER="$(jq -r '.archive_member // empty' <<<"$PLANNED")"
              if [ -z "$MEMBER" ]; then
                MEMBER="$(tar -tzf claude.bin | awk 'NF && substr($0,length($0),1) != "/" {print; exit}')"
              fi
              test -n "$MEMBER"
              rm -rf _extract && mkdir -p _extract
              tar -xzf claude.bin -C _extract "$MEMBER"
              cp "_extract/${MEMBER}" "$BIN"
              ;;
            *)
              cp claude.bin "$BIN"
              ;;
          esac
          chmod +x "$BIN"

          while read -r pair; do
            NAME="$(jq -r '.name' <<<"$pair")"
            VALUE="$(jq -r '.value' <<<"$pair")"
            export "${NAME}=${VALUE}"
          done < <(jq -c '.snapshot.env[]?' _ci_tmp/plan.json | tr -d '\r')
          "$BIN" --version

      - name: Wrapper unit tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p unified-agent-api-claude-code

      - name: Wrapper examples compile gate
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p unified-agent-api-claude-code --examples
